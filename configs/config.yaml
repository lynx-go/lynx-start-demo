server:
  grpc_addr: ":9060"
  http_addr: ":8080"

data:
  database:
    source: "postgres://lynx_start_demo:lynx_start_demo@127.0.0.1:5432/lynx_start_demo?sslmode=disable"
    max_open_conns: 8

# lynx-start:config-fragment（lynx-start add 追加模块配置段的锚点，勿删）
# --- module: access ---
access:
  roles:                      # 角色目录（可审计可改；精确匹配无通配符）
    admin: ["access.assignment.write"]
    editor: []
  bootstrap_admins:           # 启动期自动授予 admin 的邮箱（未注册则告警跳过，注册后重启生效）
    - "erin@example.com"

# --- module: session ---
session:
  secret: "dev-only-session-secret-change-me"  # 令牌主密钥（与 identity 独立），生产必须更换
  access_ttl: 15m   # 访问令牌（无状态，吊销生效粒度的上界）
  refresh_ttl: 720h # 会话绝对时长（轮换不续期）
  issuer: lynx-start

# --- module: identity ---
identity:
  secret: "dev-only-identity-secret-change-me"  # 令牌主密钥，生产必须更换
  token_ttl: 30m   # 无吊销机制（v0.1），保持短时效
  issuer: lynx-start

# --- module: demo ---

