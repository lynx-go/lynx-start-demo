syntax = "proto3";

package session.v1;

option go_package = "github.com/lynx-go/lynx-start-demo/genproto/session/v1;sessionv1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "grpcapi/v1/policy.proto";

// 公开 API 面 + 文件级默认公开曝光。CreateSession 要求已认证主体
// （典型流：identity.Login → 用其令牌换可吊销会话）；Refresh 匿名
// （刷新令牌即凭证）；Logout/LogoutAll 要求会话认证（principal 由
// 本模块 Bearer 认证器注入，与 identity 令牌经认证链共存）。
option (grpcapi.v1.api) = { api: "public", default_exposure: EXPOSURE_PUBLIC };

// SessionService 是会话模块的 API 面（AIP-136 自定义方法风格）。
// 依赖 identity 模块（DependsOn）：凭证核验与principal 来源是 identity，
// 改密联动消费其事件目录（identity.user.password-changed）。
service SessionService {
  // 把当前认证主体（如 identity 登录令牌）升级为可吊销会话，
  // 返回访问+刷新令牌对。
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { post: "/v1/session" body: "*" };
  }

  // 刷新令牌轮换：旧刷新令牌换新令牌对。重放旧令牌会吊销整个会话；
  // 用户被删/停用后拒绝刷新（fail-closed 回读）。
  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (grpcapi.v1.method) = { policy: { anonymous: true } };
    option (google.api.http) = { post: "/v1/session:refresh" body: "*" };
  }

  // 登出当前会话。要求会话认证。
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { post: "/v1/session:logout" body: "*" };
  }

  // 全端下线：吊销当前用户全部活跃会话。要求认证。
  rpc LogoutAll(LogoutAllRequest) returns (LogoutAllResponse) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { post: "/v1/session:logout-all" body: "*" };
  }
}

message CreateSessionRequest {}

message CreateSessionResponse {
  string session_id = 1;
  string user_id = 2;
  string access_token = 3;
  string refresh_token = 4;
  string token_type = 5;
  google.protobuf.Timestamp access_expires_at = 6;
  google.protobuf.Timestamp session_expires_at = 7;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string session_id = 1;
  string user_id = 2;
  string access_token = 3;
  string refresh_token = 4;
  string token_type = 5;
  google.protobuf.Timestamp access_expires_at = 6;
  google.protobuf.Timestamp session_expires_at = 7;
}

message LogoutRequest {}

message LogoutAllRequest {}

message LogoutAllResponse {
  int32 revoked_count = 1;
}
