syntax = "proto3";

package demo.v1;

option go_package = "github.com/lynx-go/lynx-start-demo/genproto/demo/v1;demov1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "grpcapi/v1/policy.proto";

// 公开 API 面 + 文件级默认公开曝光；样例模块全部方法匿名可访问
// （真实模块请按需收紧）。
option (grpcapi.v1.api) = { api: "public", default_exposure: EXPOSURE_PUBLIC };

// DemoService 是样例模块的 CRUD 面（AIP-132/158 风格）。
service DemoService {
  option (grpcapi.v1.service) = { default_policy: { anonymous: true } };

  rpc CreateItem(CreateItemRequest) returns (Item) {
    option (google.api.http) = { post: "/v1/demo/items" body: "*" };
  }
  rpc GetItem(GetItemRequest) returns (Item) {
    option (google.api.http) = { get: "/v1/demo/items/{id}" };
  }
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse) {
    option (google.api.http) = { get: "/v1/demo/items" };
  }
  rpc RenameItem(RenameItemRequest) returns (Item) {
    option (google.api.http) = { patch: "/v1/demo/items/{id}" body: "*" };
  }
  rpc DeleteItem(DeleteItemRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/demo/items/{id}" };
  }
}

message Item {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message CreateItemRequest {
  string title = 1;
}

message GetItemRequest {
  string id = 1;
}

message ListItemsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListItemsResponse {
  repeated Item items = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message RenameItemRequest {
  string id = 1;
  string title = 2;
}

message DeleteItemRequest {
  string id = 1;
}
