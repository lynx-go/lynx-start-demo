syntax = "proto3";

package identity.v1;

option go_package = "github.com/lynx-go/lynx-start-demo/genproto/identity/v1;identityv1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "grpcapi/v1/policy.proto";

// 公开 API 面 + 文件级默认公开曝光。匿名方法（Register/Login）逐方法
// 声明；其余方法缺省要求认证（principal 由 identity 贡献的 Bearer
// 认证器注入）。
option (grpcapi.v1.api) = { api: "public", default_exposure: EXPOSURE_PUBLIC };

// IdentityService 是身份模块的 API 面（AIP-136 自定义方法风格）。
service IdentityService {
  // 注册即登录：建号并返回首个访问令牌。匿名可访问。
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (grpcapi.v1.method) = { policy: { anonymous: true } };
    option (google.api.http) = { post: "/v1/identity:register" body: "*" };
  }

  // 邮箱+口令换访问令牌。匿名可访问。
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (grpcapi.v1.method) = { policy: { anonymous: true } };
    option (google.api.http) = { post: "/v1/identity:login" body: "*" };
  }

  // 当前认证用户的档案。要求认证（显式声明，fail-closed）。
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { get: "/v1/identity/me" };
  }

  // 自助改密。要求认证（显式声明，fail-closed）。
  rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { patch: "/v1/identity/me/password" body: "*" };
  }
}

// User 是用户资源（不含口令散列；status 为保留位，v0.1 恒 active）。
message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
}

message RegisterResponse {
  User user = 1;
  string access_token = 2;
  string token_type = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  string access_token = 2;
  string token_type = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}
