version: v2

deps:
  - buf.build/googleapis/googleapis
  # grpcapi 声明语法（policy.proto）经 BSR 供给：应用只 import 不持有，
  # 生成 inputs 仅 directory: proto，dep 文件不产码（Go 类型由 grpcapi Go 模块提供）。
  - buf.build/lynx-go/grpcapi
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
    # AIP-131/133 风格：资源直出为响应（Get/Create 返回 Item 而非
    # XxxResponse 包裹），请求/响应名不唯一属既定风格（torchwood 同款取舍）。
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
