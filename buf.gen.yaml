version: v2
# inputs 仅本地 proto 目录：grpcapi/v1/policy.proto 经 buf.yaml deps 从
# BSR 解析参与编译，但不是生成输入——其 Go 类型由 grpcapi Go 模块提供。
inputs:
  - directory: proto
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.10
    out: genproto
    opt:
      - paths=source_relative

  - remote: buf.build/grpc-ecosystem/gateway:v2.27.4
    out: genproto
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go:v1.6.0
    out: genproto
    opt:
      - paths=source_relative
